x-common: &kafka-image
  image: apache/kafka:4.1.1

networks:
  default:
    name: kafka-network

services:
  kafka-1:
    <<: *kafka-image
    ports:
      - "${KAFKA_1_EXPOSED_PORT}:9092"
    environment:
      # Unique Node Id
      - KAFKA_NODE_ID=1
      # Cluster Id
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
      # Node roles. Controller manages cluster state. Broker stores partitions data and communicates with clients
      - KAFKA_PROCESS_ROLES=controller,broker
      # Controller quorum selects leader controller. Other controllers are leader's replicas
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091, 2@kafka-2:9091, 3@kafka-3:9091
      # Internal listeners are used for inner broker-broker, clients-broker communications.
      # Controller listener is used for controller-controller and controller-broker communications.
      # External listener is used for external client-broker communications
      - KAFKA_LISTENERS=INTERNAL://:9090, CONTROLLER://:9091, EXTERNAL://:9092
      # Advertised listeners are used for client-broker communications.
      # Client connects to bootstrap server (one of the brokers) and gets cluster metadata including advertised listeners (internal or external)
      # Client selects one of advertised listeners to connect to depending on which partition in needs
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-1:9090, EXTERNAL://${HOSTNAME:-localhost}:${KAFKA_1_EXPOSED_PORT}
      # Security protocol map defines which security protocol to use for each listener
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT, INTERNAL:PLAINTEXT
      # Listener name for controller communication
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Listener name for broker communication
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - ./volumes/server-1:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-1:9090" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka-2:
    <<: *kafka-image
    ports:
      - "${KAFKA_2_EXPOSED_PORT}:9094"
    environment:
      - KAFKA_NODE_ID=2
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091, 2@kafka-2:9091, 3@kafka-3:9091
      - KAFKA_LISTENERS=INTERNAL://:9090, CONTROLLER://:9091, EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-2:9090, EXTERNAL://${HOSTNAME:-localhost}:${KAFKA_2_EXPOSED_PORT}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT, INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - ./volumes/server-2:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-2:9090" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  kafka-3:
    <<: *kafka-image
    ports:
      - "${KAFKA_3_EXPOSED_PORT}:9096"
    environment:
      - KAFKA_NODE_ID=3
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9091, 2@kafka-2:9091, 3@kafka-3:9091
      - KAFKA_LISTENERS=INTERNAL://:9090, CONTROLLER://:9091, EXTERNAL://:9096
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-3:9090, EXTERNAL://${HOSTNAME:-localhost}:${KAFKA_3_EXPOSED_PORT}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT, INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - ./volumes/server-3:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-3:9090" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s